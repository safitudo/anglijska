<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d4ed8">
<title>Англійська · 200 слів</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🇬🇧</text></svg>">
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --text:#111827; --muted:#6b7280; --line:#e5e7eb;
  --accent:#1d4ed8; --accent-soft:#dbeafe; --green:#15803d; --green-soft:#dcfce7;
  --orange:#c2410c; --orange-soft:#ffedd5; --shadow:0 1px 3px rgba(0,0,0,.08);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f172a; --card:#1e293b; --text:#f1f5f9; --muted:#94a3b8; --line:#334155;
    --accent:#60a5fa; --accent-soft:#1e3a5f; --green:#4ade80; --green-soft:#14532d;
    --orange:#fb923c; --orange-soft:#7c2d12; --shadow:0 1px 3px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html{font-size:17px}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  line-height:1.4; min-height:100vh;
}
.wrap{max-width:640px; margin:0 auto; padding:16px 16px 96px}
h1{font-size:1.5rem; margin:8px 0 4px}
.sub{color:var(--muted); margin:0 0 16px; font-size:.95rem}
.totalbar{background:var(--card); border-radius:14px; padding:14px 16px; box-shadow:var(--shadow); margin-bottom:20px}
.totalbar .nums{display:flex; justify-content:space-between; font-size:.95rem; margin-bottom:8px}
.bar{height:10px; border-radius:5px; background:var(--line); overflow:hidden}
.bar>div{height:100%; border-radius:5px; background:var(--green); transition:width .3s}
.part-title{font-size:1.05rem; font-weight:700; color:var(--muted); margin:22px 4px 10px; text-transform:uppercase; letter-spacing:.03em}
.grid{display:grid; grid-template-columns:1fr; gap:10px}
@media(min-width:560px){ .grid{grid-template-columns:1fr 1fr} }
.sec-card{
  display:flex; align-items:center; gap:12px; background:var(--card); border:none; width:100%;
  border-radius:14px; padding:14px; box-shadow:var(--shadow); cursor:pointer; text-align:left;
  color:var(--text); font:inherit;
}
.sec-card:active{transform:scale(.98)}
.sec-emoji{font-size:1.7rem; width:44px; height:44px; display:flex; align-items:center; justify-content:center; background:var(--accent-soft); border-radius:12px; flex-shrink:0}
.sec-info{flex:1; min-width:0}
.sec-name{font-weight:600; font-size:1.02rem}
.sec-meta{color:var(--muted); font-size:.85rem; margin-top:2px}
.sec-bar{height:6px; border-radius:3px; background:var(--line); overflow:hidden; margin-top:7px}
.sec-bar>div{height:100%; background:var(--green)}
.chev{color:var(--muted); font-size:1.3rem; flex-shrink:0}
.done-badge{color:var(--green); font-weight:700}

.topbar{display:flex; align-items:center; gap:10px; margin-bottom:6px}
.backbtn{
  border:none; background:var(--card); color:var(--accent); font:inherit; font-weight:600;
  border-radius:12px; padding:10px 14px; cursor:pointer; box-shadow:var(--shadow); font-size:1rem;
}
.hint{color:var(--muted); font-size:.9rem; margin:10px 4px 14px}
.wordlist{display:flex; flex-direction:column; gap:8px}
.word-row{
  display:flex; align-items:center; gap:12px; background:var(--card); border:none; width:100%;
  border-radius:14px; padding:12px 14px; box-shadow:var(--shadow); cursor:pointer; text-align:left;
  color:var(--text); font:inherit; min-height:64px;
}
.word-row:active{transform:scale(.99)}
.word-row.playing{outline:2px solid var(--accent)}
.w-main{flex:1; min-width:0}
.w-en{font-weight:700; font-size:1.25rem}
.w-tr{color:var(--muted); font-weight:400; font-size:.95rem; margin-left:6px}
.w-uk{color:var(--muted); font-size:1rem; margin-top:1px}
.w-known{color:var(--green); font-size:1.1rem; flex-shrink:0}
.speaker{font-size:1.35rem; flex-shrink:0; opacity:.55}
.testbar{
  position:fixed; bottom:0; left:0; right:0; padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(transparent, var(--bg) 40%);
}
.testbar-inner{max-width:640px; margin:0 auto}
.bigbtn{
  width:100%; border:none; border-radius:16px; padding:16px; font:inherit; font-size:1.15rem;
  font-weight:700; cursor:pointer; color:#fff; background:var(--accent); box-shadow:var(--shadow);
}
.bigbtn:active{transform:scale(.98)}

.test-card{
  background:var(--card); border-radius:20px; box-shadow:var(--shadow); padding:32px 20px;
  text-align:center; margin-top:14px; min-height:280px; display:flex; flex-direction:column; justify-content:center; gap:10px;
}
.t-counter{color:var(--muted); font-size:.9rem}
.t-uk{font-size:1.9rem; font-weight:700; margin:6px 0}
.t-en{font-size:2.1rem; font-weight:800; color:var(--accent); margin:2px 0}
.t-tr{color:var(--muted); font-size:1.15rem}
.replay{
  border:none; background:var(--accent-soft); color:var(--accent); font:inherit; font-size:1.05rem;
  border-radius:12px; padding:10px 18px; cursor:pointer; font-weight:600; margin:8px auto 0; display:block;
}
.t-actions{display:flex; gap:10px; margin-top:16px}
.t-actions .bigbtn{font-size:1.05rem; padding:15px 8px}
.btn-no{background:var(--orange)}
.btn-yes{background:var(--green)}
.result-emoji{font-size:3rem}
.result-line{font-size:1.3rem; font-weight:700}
.stack{display:flex; flex-direction:column; gap:10px; margin-top:18px}
.bigbtn.secondary{background:var(--card); color:var(--accent)}
.footer{margin-top:28px; text-align:center; color:var(--muted); font-size:.85rem}
.footer button{border:none; background:none; color:var(--muted); text-decoration:underline; font:inherit; cursor:pointer}

@media(hover:hover){
  .sec-card:hover,.word-row:hover{outline:2px solid var(--accent-soft)}
  .bigbtn:hover{filter:brightness(1.1)}
}
@media(min-width:900px){
  html{font-size:18px}
  .wrap{max-width:1024px; padding-top:28px}
  h1{font-size:1.8rem}
  .grid{grid-template-columns:repeat(3,1fr)}
  .wordlist{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .test-card{max-width:560px; margin:24px auto 0; padding:48px 32px}
  .testbar-inner{max-width:560px}
  .totalbar{max-width:560px}
}
@media(min-width:1300px){
  .grid{grid-template-columns:repeat(4,1fr)}
  .wordlist{grid-template-columns:1fr 1fr 1fr}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="words.js"></script>
<script>
const $ = (h) => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content.firstChild; };
const app = document.getElementById('app');

// ---- progress (localStorage) ----
const LS_KEY = 'anhliyska200_known';
let known = new Set(JSON.parse(localStorage.getItem(LS_KEY) || '[]'));
const saveKnown = () => localStorage.setItem(LS_KEY, JSON.stringify([...known]));

// ---- audio ----
const audioCache = {};
let current = null;
function play(word, onEnd){
  if (current) { current.pause(); current.currentTime = 0; }
  const a = audioCache[word.audio] || (audioCache[word.audio] = new Audio('audio/' + word.audio));
  current = a;
  a.onended = onEnd || null;
  a.play().catch(()=>{});
}

function sectionWords(sec){
  const out = [];
  for (let i = sec.from; i <= sec.to; i++) out.push({ ...WORDS[i], id: i });
  return out;
}
function knownIn(sec){
  let n = 0;
  for (let i = sec.from; i <= sec.to; i++) if (known.has(i)) n++;
  return n;
}

// ---- home ----
function renderHome(){
  app.innerHTML = '';
  const total = known.size;
  app.appendChild($(`<h1>🇬🇧 Англійська · 200 слів</h1>`));
  app.appendChild($(`<p class="sub">Натисни на тему, вчи слова, потім перевір себе. Прогрес зберігається на цьому телефоні.</p>`));
  app.appendChild($(`<div class="totalbar">
      <div class="nums"><span>Вивчено</span><b>${total} із 200</b></div>
      <div class="bar"><div style="width:${total/2}%"></div></div>
    </div>`));
  PARTS.forEach((part, pi) => {
    app.appendChild($(`<div class="part-title">${part.title}</div>`));
    const grid = $(`<div class="grid"></div>`);
    part.sections.forEach((sec, si) => {
      const k = knownIn(sec);
      const done = k === sec.n;
      const card = $(`<button class="sec-card">
          <span class="sec-emoji">${sec.emoji}</span>
          <span class="sec-info">
            <span class="sec-name">${sec.title}</span>
            <span class="sec-meta" style="display:block">${done ? '<span class="done-badge">✓ вивчено</span>' : k + ' із ' + sec.n + ' слів'}</span>
            <span class="sec-bar" style="display:block"><div style="width:${100*k/sec.n}%"></div></span>
          </span>
          <span class="chev">›</span>
        </button>`);
      card.onclick = () => { location.hash = `#/s/${pi}-${si}`; };
      grid.appendChild(card);
    });
    app.appendChild(grid);
  });
  const f = $(`<div class="footer">Слова та озвучка — з колоди Anki «Англійська 200».<br><button id="reset">Скинути прогрес</button></div>`);
  f.querySelector('#reset').onclick = () => {
    if (confirm('Скинути весь прогрес?')) { known = new Set(); saveKnown(); renderHome(); }
  };
  app.appendChild(f);
  window.scrollTo(0,0);
}

// ---- section (learn list) ----
function renderSection(pi, si){
  const sec = PARTS[pi].sections[si];
  const words = sectionWords(sec);
  app.innerHTML = '';
  const top = $(`<div class="topbar"><button class="backbtn">‹ Назад</button><h1 style="margin:0;font-size:1.25rem">${sec.emoji} ${sec.title}</h1></div>`);
  top.querySelector('.backbtn').onclick = () => { location.hash = '#/'; };
  app.appendChild(top);
  app.appendChild($(`<p class="hint">🔊 Натисни на слово — почуєш вимову. Повтори вголос 2–3 рази.</p>`));
  const list = $(`<div class="wordlist"></div>`);
  words.forEach(w => {
    const row = $(`<button class="word-row">
        <span class="w-main">
          <span class="w-en">${w.en}<span class="w-tr">[${w.tr}]</span></span>
          <span class="w-uk" style="display:block">${w.uk}</span>
        </span>
        ${known.has(w.id) ? '<span class="w-known">✓</span>' : ''}
        <span class="speaker">🔊</span>
      </button>`);
    row.onclick = () => {
      document.querySelectorAll('.word-row.playing').forEach(el => el.classList.remove('playing'));
      row.classList.add('playing');
      play(w, () => row.classList.remove('playing'));
    };
    list.appendChild(row);
  });
  app.appendChild(list);
  const bar = $(`<div class="testbar"><div class="testbar-inner"><button class="bigbtn">✍️ Перевірити себе</button></div></div>`);
  bar.querySelector('.bigbtn').onclick = () => renderTest(pi, si, words);
  app.appendChild(bar);
  window.scrollTo(0,0);
}

// ---- test mode ----
function renderTest(pi, si, queue){
  const sec = PARTS[pi].sections[si];
  let idx = 0;
  const missed = [];
  let gotKnown = 0;

  function step(){
    if (idx >= queue.length) return finish();
    const w = queue[idx];
    app.innerHTML = '';
    const top = $(`<div class="topbar"><button class="backbtn">‹ Вийти</button><h1 style="margin:0;font-size:1.25rem">${sec.emoji} ${sec.title}</h1></div>`);
    top.querySelector('.backbtn').onclick = () => renderSection(pi, si);
    app.appendChild(top);
    const card = $(`<div class="test-card">
        <div class="t-counter">${idx+1} із ${queue.length}</div>
        <div class="t-uk">${w.uk}</div>
        <div id="answer" style="display:none">
          <div class="t-en">${w.en}</div>
          <div class="t-tr">[${w.tr}]</div>
          <button class="replay">🔊 Ще раз</button>
          <div class="t-actions">
            <button class="bigbtn btn-no">Ще вчу</button>
            <button class="bigbtn btn-yes">Знаю ✓</button>
          </div>
        </div>
        <div id="revealwrap"><button class="bigbtn" id="reveal" style="margin-top:14px">Показати відповідь</button></div>
      </div>`);
    card.querySelector('#reveal').onclick = () => {
      card.querySelector('#revealwrap').style.display = 'none';
      card.querySelector('#answer').style.display = 'block';
      play(w);
    };
    card.querySelector('.replay').onclick = () => play(w);
    card.querySelector('.btn-yes').onclick = () => { known.add(w.id); gotKnown++; saveKnown(); idx++; step(); };
    card.querySelector('.btn-no').onclick = () => { known.delete(w.id); missed.push(w); saveKnown(); idx++; step(); };
    app.appendChild(card);
    window.scrollTo(0,0);
  }

  function finish(){
    app.innerHTML = '';
    const allGood = missed.length === 0;
    const card = $(`<div class="test-card">
        <div class="result-emoji">${allGood ? '🎉' : '💪'}</div>
        <div class="result-line">${allGood ? 'Чудово! Всі слова знаєш!' : `Знаєш ${gotKnown} із ${queue.length}`}</div>
        <div style="color:var(--muted)">${allGood ? 'Можна переходити до наступної теми.' : 'Ті, що ще вчиш, повторимо ще раз.'}</div>
        <div class="stack">
          ${allGood ? '' : '<button class="bigbtn" id="again">🔁 Повторити ті, що ще вчу (' + missed.length + ')</button>'}
          <button class="bigbtn secondary" id="tolist">📖 До списку слів</button>
          <button class="bigbtn secondary" id="home">🏠 На головну</button>
        </div>
      </div>`);
    if (!allGood) card.querySelector('#again').onclick = () => renderTest(pi, si, missed);
    card.querySelector('#tolist').onclick = () => renderSection(pi, si);
    card.querySelector('#home').onclick = () => { location.hash = '#/'; };
    app.appendChild(card);
    window.scrollTo(0,0);
  }
  step();
}

// ---- routing ----
function route(){
  const m = location.hash.match(/^#\/s\/(\d+)-(\d+)$/);
  if (m && PARTS[+m[1]] && PARTS[+m[1]].sections[+m[2]]) renderSection(+m[1], +m[2]);
  else renderHome();
}
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
